        <AdminEpics />
      </div>
    </div>
  );
};

// ─── APP SHELL ──────────────────────────────────────────────────────────────
const TABS = [
  { key: "feed", label: "News Feed", icon: "feed", minRole: "viewer" },
  { key: "mini", label: "Mini Events", icon: "clock", minRole: "viewer" },
  { key: "main", label: "Main Events", icon: "trophy", minRole: "viewer" },
  { key: "approvals", label: "Approvals", icon: "inbox", minRole: "superior" },
  { key: "admin", label: "Admin", icon: "gear", minRole: "admin" },
];

const ROLE_LABEL = { viewer: "Viewer", superior: "Superior", admin: "Admin" };

// 100dvh tracks the real visible height on phones (accounting for the address
// bar showing/hiding); 100vh is the fallback for browsers that don't support it.
const FULL_HEIGHT = (typeof CSS !== "undefined" && CSS.supports && CSS.supports("height", "100dvh")) ? "100dvh" : "100vh";

const AppShell = ({ role, onLogout }) => {
  const [tab, setTab] = useState("feed");
  const visibleTabs = TABS.filter(t => roleAtLeast(role, t.minRole));
  const pendingCount = roleAtLeast(role, "superior") ? Store.getPending().length : 0;

  return (
    <SessionCtx.Provider value={{ role }}>
      <div style={{ height: FULL_HEIGHT, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <header style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "14px 18px", background: "#0f172a", color: "#f1f5f9",
        }}>
          <div style={{ fontWeight: 600, fontSize: 16 }}>69 Event Tracker</div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{
              fontSize: 11, background: "#1e293b", color: "#94a3b8",
              padding: "3px 9px", borderRadius: 999,
            }}>{ROLE_LABEL[role]}</span>
            <button
              onClick={onLogout}
              style={{
                background: "none", border: "1px solid #334155", color: "#94a3b8",
                borderRadius: 6, padding: "4px 10px", fontSize: 12,
              }}
            >Log out</button>
          </div>
        </header>

        <main style={{ flex: 1, overflowY: "auto" }}>
          {tab === "feed" && <NewsFeedScreen />}
          {tab === "mini" && <MiniEventsScreen />}
          {tab === "main" && <MainEventsScreen />}
          {tab === "approvals" && <ApprovalsScreen />}
          {tab === "admin" && <AdminScreen />}
        </main>

        <nav style={{
          position: "fixed", bottom: 0, left: 0, right: 0,
          display: "flex", background: "#fff", borderTop: "1px solid #e2e8f0",
          paddingBottom: "env(safe-area-inset-bottom)",
        }}>
          {visibleTabs.map(t => (
            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              style={{
                position: "relative", flex: 1, border: "none", background: "none", padding: "10px 4px 8px",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                color: tab === t.key ? "#0f172a" : "#94a3b8",
                fontWeight: tab === t.key ? 600 : 400,
              }}
            >
              <span style={{ position: "relative", display: "flex" }}>
                <Icon name={t.icon} size={20} />
                {t.key === "approvals" && pendingCount > 0 && (
                  <span style={{
                    position: "absolute", top: -4, right: -10, background: "#dc2626", color: "#fff",
                    fontSize: 9, fontWeight: 700, borderRadius: 999, padding: "1px 5px", lineHeight: "12px",
                  }}>{pendingCount}</span>
                )}
              </span>
              <span style={{ fontSize: 11 }}>{t.label}</span>
            </button>
          ))}
        </nav>
      </div>
    </SessionCtx.Provider>
  );
};

const LoadingScreen = ({ text }) => (
  <div style={{
    minHeight: "100vh", display: "flex", flexDirection: "column",
    alignItems: "center", justifyContent: "center", background: "#f8fafc", gap: 12,
  }}>
    <Icon name="hourglass" size={32} style={{ color: "#94a3b8" }} />
    <div style={{ color: "#64748b", fontSize: 14 }}>{text}</div>
  </div>
);

// ─── ROOT ───────────────────────────────────────────────────────────────────
const App = () => {
  const [session, setSession] = useState(() => loadSession());
  // No Sheets configured yet → nothing to wait for, start ready (matches the
  // original instant local-only behaviour). Once SHEETS_URL is set, every
  // fresh login pulls the shared copy down before the app is usable.
  const [dataReady, setDataReady] = useState(!sheetsEnabled());
  const [syncError, setSyncError] = useState(false);

  useEffect(() => {
    if (!session) return;
    const bump = () => saveSession(session.role);
    window.addEventListener("click", bump);
    window.addEventListener("keydown", bump);
    return () => {
      window.removeEventListener("click", bump);
      window.removeEventListener("keydown", bump);
    };
  }, [session]);

  useEffect(() => {
    if (!session || !sheetsEnabled()) return;
    let cancelled = false;
    setDataReady(false);
    setSyncError(false);
    Store.loadFromRemote().then(ok => {
      if (cancelled) return;
      if (!ok) setSyncError(true);
      setDataReady(true);
    });
    return () => { cancelled = true; };
  }, [session]);

  const handleLogout = () => {
    saveSession(null);
    setSession(null);
    setDataReady(!sheetsEnabled());
    setSyncError(false);
  };

  if (!session) {
    return <LoginScreen onLogin={(role) => setSession({ role })} />;
  }

  if (!dataReady) {
    return <LoadingScreen text="Loading shared data…" />;
  }

  return (
    <React.Fragment>
      {syncError && (
        <div style={{ background: "#fef3c7", color: "#92400e", fontSize: 12, textAlign: "center", padding: "6px 12px" }}>
          Couldn't reach the shared data — showing this device's local copy instead.
        </div>
      )}
      <AppShell role={session.role} onLogout={handleLogout} />
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
