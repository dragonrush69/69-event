  <script type="text/babel">
const { useState, useRef, useEffect, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════════════════════
// DAY 1 — App shell, role-based login, bottom nav, local data layer.
// Mini Events / Main Events / Admin screens are placeholders — built out
// on later days. The Store API below is the seam that gets swapped for a
// Google Sheets / Apps Script backend later (Phase 5, per the build plan),
// so screens should only ever talk to Store, never to localStorage directly.
// ═══════════════════════════════════════════════════════════════════════════

// ─── PIN CONFIG ───────────────────────────────────────────────────────────
// Change these before real use — and again from the Admin tab once it's built.
// Roles are additive: admin can do everything superior can, superior can do
// everything viewer can.
const DEFAULT_PINS = {
  viewer:   "1111",  // players — read-only: timings, tips, score history
  superior: "2222",  // + can enter scores for events
  admin:    "9999",  // + Admin tab: reset PINs, manage divisions, edit tips
};

const ROLE_RANK = { viewer: 1, superior: 2, admin: 3 };
function roleAtLeast(role, min) {
  return !!role && (ROLE_RANK[role] || 0) >= ROLE_RANK[min];
}

// ─── GOOGLE SHEETS BACKEND ──────────────────────────────────────────────────
// Paste your Apps Script Web App URL here after deploying it (see the
// matching AppScript_Backend.js file + setup guide). Until this is filled
// in, the app runs fine on its own using only the browser's local storage —
// each device just won't see other devices' data.
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxdwm-0VtXCsQZWU-2UDJDRU-rtJ6v9R6jt6jC_RptRxVTJJaoGIBh8V7WaQRNdH3HKag/exec";

const sheetsEnabled = () => SHEETS_URL && !SHEETS_URL.startsWith("YOUR_");

async function loadFromSheets() {
  if (!sheetsEnabled()) return null;
  try {
    const res = await fetch(SHEETS_URL, { redirect: "follow" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (err) {
    console.warn("Sheets load failed:", err);
    return null;
  }
}

// Fire-and-forget: Apps Script Web Apps don't return CORS headers on POST,
// so we use no-cors and never read the response — errors here are network
// failures only (e.g. offline), not rejections from the script itself.
async function saveToSheets(data) {
  if (!sheetsEnabled()) return;
  try {
    await fetch(SHEETS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(data),
    });
  } catch (err) {
    console.warn("Sheets save failed:", err);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// STORE — local data layer. Everything reads/writes through here.
// Backed by localStorage for instant, offline-friendly reads/writes; when
// SHEETS_URL is configured above, every write also syncs to the shared
// Google Sheet in the background, and a fresh login pulls the latest shared
// copy down (see Store.loadFromRemote, called once per login in <App>).
// ═══════════════════════════════════════════════════════════════════════════
const STORAGE_KEY = "eventtracker_data_v1";

// The 19 mini events, in the order totalcalculator.org/events.php lists them.
// Pulled 20 Aug 2026 — if the site adds/renames events later, update this list
// (Admin-managed event lists are a possible future improvement, not in scope yet).
const MINI_EVENTS = [
  "Castle Development", "Scientific Progress", "Capital Challenge",
  "Blessing of the Gods", "Officer Academy", "Hammer and Anvil",
  "Tar Mastery", "Regular Decrees", "Battle Training", "Power Points",
  "Silver Rush", "Wargames", "Gold Rush", "Call of Duty", "Beastslayer",
  "War Tools", "Crypt Raiders", "The Quest for Chests", "The King's Mercy",
];

// Main events, in the order totalcalculator.org/events.php lists them.
// Monthly and Weekly carry a division per occurrence; Biweekly doesn't.
const MAIN_EVENTS = [
  { name: "Ragnarok",           category: "monthly",  hasDivisions: true },
  { name: "Armageddon",         category: "monthly",  hasDivisions: true },
  { name: "Dark Omens",         category: "monthly",  hasDivisions: true },
  { name: "Shadow Invasion",    category: "monthly",  hasDivisions: true },
  { name: "Hellforge",          category: "monthly",  hasDivisions: true },
  { name: "Trials of Olympus",  category: "monthly",  hasDivisions: true },
  { name: "Doomsday",           category: "weekly",   hasDivisions: true },
  { name: "Arachne",            category: "weekly",   hasDivisions: true },
  { name: "Ancient's Treasure", category: "weekly",   hasDivisions: true },
  { name: "Rise of the Ancients", category: "weekly", hasDivisions: true },
  { name: "Thirst for Battle",  category: "weekly",   hasDivisions: true },
  { name: "Clash for the Throne", category: "biweekly", hasDivisions: false },
  { name: "Clash of Kingdoms",  category: "biweekly", hasDivisions: false },
];
const MAIN_EVENT_LOOKUP = Object.fromEntries(MAIN_EVENTS.map(e => [e.name, e]));
const MAIN_CATEGORY_LABEL = { monthly: "Monthly", weekly: "Weekly", biweekly: "Biweekly" };

// Some events run at the exact same time as another event that's already
// scraped, rather than needing to be scraped separately — Kirsty confirmed
// "Thirst for Battle" always runs simultaneously with "Clash for the
// Throne" (which itself already runs simultaneously with "Clash of
// Kingdoms"). Alias its timing lookup instead of adding a redundant scrape.
const EVENT_TIMING_ALIAS = {
  "Thirst for Battle": [
    { category: "biweekly", name: "Clash for the Throne" },
    { category: "biweekly", name: "Clash of Kingdoms" },
  ],
};

function emptyEventEntry() {
  return {
    tip: "",
    rewards: { first: "", rest: "" }, // 1st place, and 2nd-100th place (same reward across that whole range)
    history: [], // [{ id, date, highest, lowest, division? }], newest first, max 3
  };
}

function buildDefaultMiniEvents() {
  const out = {};
  MINI_EVENTS.forEach(name => { out[name] = emptyEventEntry(); });
  return out;
}

function buildDefaultMainEvents() {
  const out = {};
  MAIN_EVENTS.forEach(e => { out[e.name] = emptyEventEntry(); });
  return out;
}

const DEFAULT_DATA = {
  pins: { ...DEFAULT_PINS },
  divisions: [],       // e.g. ["X - 9", "VII - 21"] — grows as people use new ones; full add/delete management is an Admin feature
  miniEvents: buildDefaultMiniEvents(),
  mainEvents: buildDefaultMainEvents(),
  schedule: { lastScraped: null, items: [] }, // filled by a future scraper
  pending: [], // viewer-submitted scores awaiting Superior/Admin approval
  epics: [],   // Admin-entered epic monster stat sheets, linked to a Main Event (+ optional day) — see Store.addEpic
};

// Fill in a possibly-partial data object (from localStorage or Sheets) with
// defaults for anything missing, so old/incomplete saves never crash newer
// code that expects a field to exist. Shared by _load() and loadFromRemote().
function normalizeData(parsed) {
  const data = { ...DEFAULT_DATA, ...(parsed || {}) };
  data.miniEvents = { ...buildDefaultMiniEvents(), ...(parsed?.miniEvents || {}) };
  data.mainEvents = { ...buildDefaultMainEvents(), ...(parsed?.mainEvents || {}) };
  data.divisions = parsed?.divisions || [];
  data.pending = parsed?.pending || [];
  data.pins = { ...DEFAULT_PINS, ...(parsed?.pins || {}) };
  data.epics = parsed?.epics || [];
  return data;
}

const Store = {
  _cache: null,

  _load() {
    if (Store._cache) return Store._cache;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      Store._cache = normalizeData(raw ? JSON.parse(raw) : {});
    } catch {
      Store._cache = { ...DEFAULT_DATA };
    }
    return Store._cache;
  },

  // Pull the shared copy down from Google Sheets and make it the active
  // cache (Sheets is treated as the source of truth once configured).
  // Returns true on success, false if Sheets isn't configured or unreachable
  // — callers should fall back to whatever's already in localStorage.
  async loadFromRemote() {
    if (!sheetsEnabled()) return false;
    const remote = await loadFromSheets();
    if (!remote || remote.error) return false;
    Store._cache = normalizeData(remote);
    Store._persistLocal();
    return true;
  },

  _persistLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Store._cache)); } catch {}
  },

  _save() {
    Store._persistLocal();
    if (sheetsEnabled()) saveToSheets(Store._cache); // fire-and-forget background sync
  },

  getAll() {
    return Store._load();
  },

  get(key) {
    return Store._load()[key];
  },

  set(key, value) {
    const data = Store._load();
    data[key] = value;
    Store._save();
  },

  getPins() {
    return { ...DEFAULT_PINS, ...(Store._load().pins || {}) };
  },

  setPin(role, pin) {
    const data = Store._load();
    data.pins = { ...Store.getPins(), [role]: pin };
    Store._save();
  },

  getMiniEvent(name) {
    const data = Store._load();
    return data.miniEvents[name] || emptyEventEntry();
  },

  setMiniEvent(name, patch) {
    const data = Store._load();
    data.miniEvents[name] = { ...emptyEventEntry(), ...data.miniEvents[name], ...patch };
    Store._save();
  },

  // Admin/Superior-only: remove a single score entry from a mini event's history.
  deleteMiniEventEntry(name, entryId) {
    const data = Store._load();
    const ev = data.miniEvents[name] || emptyEventEntry();
    data.miniEvents[name] = { ...ev, history: ev.history.filter(h => h.id !== entryId) };
    Store._save();
  },

  getMainEvent(name) {
    const data = Store._load();
    return data.mainEvents[name] || emptyEventEntry();
  },

  setMainEvent(name, patch) {
    const data = Store._load();
    data.mainEvents[name] = { ...emptyEventEntry(), ...data.mainEvents[name], ...patch };
    Store._save();
  },

  // Admin/Superior-only: remove a single score entry from a main event's history.
  deleteMainEventEntry(name, entryId) {
    const data = Store._load();
    const ev = data.mainEvents[name] || emptyEventEntry();
    data.mainEvents[name] = { ...ev, history: ev.history.filter(h => h.id !== entryId) };
    Store._save();
  },

  // ── Divisions ────────────────────────────────────────────────────────
  // A simple growing list of division names (e.g. "X - 9"). Anyone entering
  // a division that isn't in the list yet adds it, so the picker is always
  // up to date without needing Admin to pre-populate it. Full add/delete
  // management from Admin is still a later feature.
  getDivisions() {
    return Store._load().divisions || [];
  },

  ensureDivision(name) {
    const clean = (name || "").trim();
    if (!clean) return;
    const data = Store._load();
    if (!data.divisions.includes(clean)) {
      data.divisions = [...data.divisions, clean];
      Store._save();
    }
  },

  removeDivision(name) {
    const data = Store._load();
    data.divisions = (data.divisions || []).filter(d => d !== name);
    Store._save();
  },

  // ── Pending approvals ─────────────────────────────────────────────────
  // Viewer-submitted scores land here first. Superior/Admin approve (which
  // files them into the event's history) or reject (which just discards them).
  getPending() {
    return Store._load().pending || [];
  },

  addPending(entry) {
    const data = Store._load();
    data.pending = [...(data.pending || []), entry];
    Store._save();
  },

  rejectPending(id) {
    const data = Store._load();
    data.pending = (data.pending || []).filter(p => p.id !== id);
    Store._save();
  },

  approvePending(id) {
    const data = Store._load();
    const idx = (data.pending || []).findIndex(p => p.id === id);
    if (idx === -1) return;
    const item = data.pending[idx];
    data.pending.splice(idx, 1);
    if (item.category === "mini") {
      const ev = data.miniEvents[item.eventName] || emptyEventEntry();
      const entry = {
        id: item.id, date: item.submittedAt,
        highest: item.highest, lowest: item.lowest, submittedBy: item.submittedBy,
      };
      ev.history = [entry, ...ev.history].slice(0, 3);
      data.miniEvents[item.eventName] = ev;
    } else if (item.category === "main") {
      const ev = data.mainEvents[item.eventName] || emptyEventEntry();
      const entry = {
        id: item.id, date: item.submittedAt,
        highest: item.highest, lowest: item.lowest, submittedBy: item.submittedBy,
        division: item.division || null,
      };
      ev.history = [entry, ...ev.history].slice(0, 3);
      data.mainEvents[item.eventName] = ev;
      if (item.division) {
        const clean = item.division.trim();
        if (clean && !data.divisions.includes(clean)) data.divisions = [...data.divisions, clean];
      }
    }
    Store._save();
  },

  // ── Epics ────────────────────────────────────────────────────────────
  // Admin-entered monster stat sheets for a Main Event's epic(s). One event
  // can have several (e.g. a different epic per day) — each is its own
  // record with a list of monster rows.
  getEpics() {
    return Store._load().epics || [];
  },

  getEpicsForEvent(eventName) {
    return Store.getEpics().filter(e => e.event === eventName);
  },

  addEpic(epic) {
    const data = Store._load();
    data.epics = [...(data.epics || []), epic];
    Store._save();
  },

  updateEpic(id, patch) {
    const data = Store._load();
    data.epics = (data.epics || []).map(e => e.id === id ? { ...e, ...patch } : e);
    Store._save();
  },

  deleteEpic(id) {
    const data = Store._load();
    data.epics = (data.epics || []).filter(e => e.id !== id);
    Store._save();
  },
};

// ── Epic paste parser ───────────────────────────────────────────────────
// Turns tab-separated rows (pasted straight from a spreadsheet) into a list
// of monster stat objects. Column order matches a standard export:
// Epic | # of Monsters | Order | Name | Type 1 | Type 2 | Type 3 |
// Strength Against | % Strength Against | Initiative | Strength | Health |
// Leadership | Quantity | Total Health | Total Strength | Captain/Hero |
// Number of Captains
// Captain/Hero and Number of Captains are the same for every monster in an
// epic (confirmed by Kirsty), so they're read once from the first row and
// returned as epic-level fields rather than being repeated per monster.
const EPIC_MONSTER_FIELDS = [
  "order", "name", "type1", "type2", "type3", "strengthAgainst", "pctStrengthAgainst",
  "initiative", "strength", "health", "leadership", "quantity",
  "totalHealth", "totalStrength",
];

// Captain/Hero is a fixed set of options rather than free text.
const CAPTAIN_HERO_OPTIONS = ["Captain", "Hero", "Hero & Captains"];
function normalizeCaptainHero(value) {
  const s = (value || "").trim().toLowerCase();
  if (!s) return "";
  const found = CAPTAIN_HERO_OPTIONS.find(o => o.toLowerCase() === s);
  if (found) return found;
  if (s === "c") return "Captain";
  if (s === "h") return "Hero";
  return ""; // unrecognised abbreviation from a paste — leave for manual selection
}

function parseEpicPaste(text) {
  const lines = (text || "").trim().split(/\r?\n/).filter(l => l.trim() !== "");
  if (lines.length === 0) return { error: "Paste at least one row of monster data." };

  let rows = lines.map(l => l.split("\t"));
  // Skip a header row if it looks like one (first cell literally "Epic").
  if (rows[0][0] && rows[0][0].trim().toLowerCase() === "epic") {
    rows = rows.slice(1);
  }
  if (rows.length === 0) return { error: "No data rows found after the header." };

  let epicName = "";
  let captainHero = "", numCaptains = "";
  const monsters = [];
  for (const cols of rows) {
    const clean = cols.map(c => (c || "").trim());
    if (clean.length < 4 || !clean[3]) continue; // need at least a Name (col 4) to count as a row
    if (!epicName && clean[0]) epicName = clean[0];
    if (!captainHero && clean[16]) captainHero = clean[16];
    if (!numCaptains && clean[17]) numCaptains = clean[17];
    const monster = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}` };
    EPIC_MONSTER_FIELDS.forEach((field, i) => { monster[field] = clean[i + 2] || ""; }); // +2 skips Epic, # of Monsters
    monsters.push(monster);
  }

  if (!epicName) return { error: "Couldn't find an epic name in the first column of any row." };
  if (monsters.length === 0) return { error: "Couldn't find any rows with a monster name." };
  return { epicName, captainHero, numCaptains, monsters };
}

function resolvePin(pin) {
  const pins = Store.getPins();
  if (pin === pins.admin)    return "admin";
  if (pin === pins.superior) return "superior";
  if (pin === pins.viewer)   return "viewer";
  return null;
}

// ─── SESSION ──────────────────────────────────────────────────────────────
const SESSION_KEY = "eventtracker_session";
const SESSION_TIMEOUT_HRS = 4;

function loadSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if (!s) return null;
    const navType = performance?.getEntriesByType?.("navigation")?.[0]?.type;
    if (navType === "navigate") return null; // fresh URL load always re-prompts
    if (Date.now() - (s.lastActivity || 0) > SESSION_TIMEOUT_HRS * 3600000) {
      sessionStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch { return null; }
}
function saveSession(role) {
  if (role) sessionStorage.setItem(SESSION_KEY, JSON.stringify({ role, lastActivity: Date.now() }));
  else sessionStorage.removeItem(SESSION_KEY);
}

const SessionCtx = createContext(null);
const useSession = () => useContext(SessionCtx);

// ─── LOGIN SCREEN ─────────────────────────────────────────────────────────
const LoginScreen = ({ onLogin }) => {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const submit = (finalPin) => {
    const role = resolvePin(finalPin);
    if (role) {
      saveSession(role);
      onLogin(role);
    } else {
      setError(true);
      setShake(true);
      setPin("");
      setTimeout(() => setShake(false), 500);
    }
  };

  const tap = (val) => {
    setError(false);
    const next = pin + val;
    setPin(next);
    if (next.length === 4) submit(next);
  };
  const backspace = () => setPin(p => p.slice(0, -1));

  return (
    <div style={{
      minHeight: "100vh", display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", background: "#0f172a", padding: 24,
    }}>
      <Icon name="shield" size={40} style={{ color: "#f1f5f9", marginBottom: 4 }} />
      <h1 style={{ color: "#f1f5f9", fontSize: 22, margin: "0 0 4px" }}>69 Event Tracker</h1>
      <p style={{ color: "#94a3b8", fontSize: 13, margin: "0 0 28px" }}>Enter PIN to continue</p>

      <div style={{
        display: "flex", gap: 12, marginBottom: 28,
        animation: shake ? "shake 0.4s" : "none",
      }}>
        {[0, 1, 2, 3].map(i => (
          <div key={i} style={{
            width: 16, height: 16, borderRadius: "50%",
            background: i < pin.length ? (error ? "#ef4444" : "#38bdf8") : "#334155",
            transition: "background 0.15s",
          }} />
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 68px)", gap: 14 }}>
        {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((k, i) => (
          k === "" ? <div key={i} /> :
          <button
            key={i}
            onClick={() => k === "⌫" ? backspace() : tap(k)}
            style={{
              width: 68, height: 68, borderRadius: "50%", border: "1px solid #334155",
              background: "#1e293b", color: "#f1f5f9", fontSize: 22, fontWeight: 500,
            }}
          >{k}</button>
        ))}
      </div>

      {error && <p style={{ color: "#ef4444", fontSize: 13, marginTop: 20 }}>Incorrect PIN — try again</p>}

      <style>{`
        @keyframes shake {
          10%, 90% { transform: translateX(-2px); }
          20%, 80% { transform: translateX(4px); }
          30%, 50%, 70% { transform: translateX(-8px); }
          40%, 60% { transform: translateX(8px); }
        }
      `}</style>
    </div>
  );
};

// ─── PLACEHOLDER SCREENS (built out on later days) ─────────────────────────
const PlaceholderScreen = ({ title, subtitle, dayNote }) => (

// ─── MINI EVENTS ────────────────────────────────────────────────────────────
function formatDateTime(iso) {
  try {
    return new Date(iso).toLocaleString(undefined, {
      day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
    });
  } catch { return iso; }
}
function formatScore(n) {
  return Number(n).toLocaleString();
}
// Adds thousand-separator commas to values that are plain numbers (e.g.
// "70000" → "70,000"), while leaving percentages, combined strings, and
// text codes ("45%", "Mounted", "C") untouched. Used for Epic monster stats,
// where fields are stored as raw strings but some are large numbers.
function formatMaybeNum(value) {
  if (value === null || value === undefined || value === "") return value;
  const s = String(value).trim();
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s).toLocaleString() : value;
}
// Abbreviates large plain numbers with K/M/B/T suffixes (e.g. "7310000000000"
// → "7.31T"), for resource totals like Meat that can run into the trillions.
// Anything that isn't a plain number (already abbreviated, blank, etc.) is
// left exactly as entered.
function formatCompact(value) {
  if (value === null || value === undefined || value === "") return value;
  const s = String(value).trim();
  if (!/^-?\d+(\.\d+)?$/.test(s)) return value;
  const num = Number(s);
  const abs = Math.abs(num);
  const tiers = [
    { v: 1e12, sfx: "T" }, { v: 1e9, sfx: "B" }, { v: 1e6, sfx: "M" }, { v: 1e3, sfx: "K" },
  ];
  for (const t of tiers) {
    if (abs >= t.v) return `${(num / t.v).toFixed(2).replace(/\.?0+$/, "")}${t.sfx}`;
  }
  return num.toLocaleString();
}
// Epic "Day" field is often just a plain number ("1", "2") — show it as
// "Day - 1" / "Day - 2" instead of a bare digit (Kirsty's exact requested
// format, 2026-08-20 — replaced the earlier "1 day"/"2 days" wording).
// Anything already worded (e.g. "Day 1-2", "Final day") is left exactly as
// typed, so free-form entries like Trials of Olympus's "Day 1"/"Day 2"
// markers still pass through unchanged.
function formatDayLabel(day) {
  const s = (day || "").trim();
  if (!s) return "";
  return /^\d+$/.test(s) ? `Day - ${s}` : s;
}

// ─── TIMING (from the Apps Script scraper's cache) ─────────────────────────
// How long before an event's own hour-boundary transition it starts being
// flagged as "ending soon" rather than a plain "Running now".
const ENDING_SOON_MS = 2 * 60 * 1000;

// The hourly scrape (~2 min past the hour, per the Apps Script trigger) can
// lag up to ~15+ minutes behind the real in-game hour-reset, so its cached
// `running` flag can be stale right around a transition. But every event's
// own `nextStart` IS the exact hour-boundary the site computed at scrape
// time — so the live client-side clock can be trusted more than the cached
// flag once "now" has actually passed it:
//  - within the last ENDING_SOON_MS before nextStart while running → flag
//    as "ending soon" instead of a plain "running"
//  - once now has passed nextStart while still cached as running → that run
//    has ended and we don't yet know what replaces it (no fresh scrape data
//    yet) → neither confidently running nor confidently timed
//  - once now has passed nextStart while NOT running → the predicted start
//    has already happened → optimistically treat it as running now, rather
//    than showing a frozen/stale "Starts in" countdown
// Kirsty (2026-08-20): "2 mins before it should say it is ending, on the
// hour it should show the new event starting" — this is what drives both
// display AND list sort order for every event, not just the aliased ones.
function getEffectiveSchedule(sched, now) {
  if (!sched) return null;
  const nextStartMs = sched.nextStart ? new Date(sched.nextStart).getTime() : null;
  const msToNext = nextStartMs != null ? nextStartMs - now.getTime() : null;

  if (sched.running) {
    if (msToNext != null && msToNext <= 0) {
      return { running: false, endingSoon: false, msToNext: null, justEnded: true };
    }
    return { running: true, endingSoon: msToNext != null && msToNext <= ENDING_SOON_MS, msToNext, justEnded: false };
  }

  if (msToNext != null && msToNext <= 0) {
    return { running: true, endingSoon: false, msToNext: null, justEnded: false };
  }
  return { running: false, endingSoon: false, msToNext, justEnded: false };
}

function getScheduleItem(category, name, now) {
  const alias = EVENT_TIMING_ALIAS[name];
  const schedule = Store.get("schedule") || { items: [] };
  const items = schedule.items || [];
  const asOf = now || new Date();

  if (alias) {
    // Kirsty confirmed "Thirst for Battle" runs at the exact same time as
    // BOTH "Clash for the Throne" and "Clash of Kingdoms" — check every
    // aliased target rather than just one, so a scraping hiccup on either
    // source alone doesn't wrongly show "not running"/no timing. Pick by
    // each target's EFFECTIVE state (see getEffectiveSchedule above), not
    // just the raw cached `running` flag, so the aliased event flips to
    // whichever source is actually current the moment the hour ticks over.
    const targets = alias.map(a => items.find(i => i.category === a.category && i.name === a.name)).filter(Boolean);
    if (targets.length === 0) return null;
    const withEffective = targets.map(t => ({ t, eff: getEffectiveSchedule(t, asOf) }));
    const running = withEffective.find(x => x.eff && x.eff.running);
    if (running) return running.t;
    const upcoming = withEffective
      .filter(x => x.eff && x.eff.msToNext != null)
      .sort((a, b) => a.eff.msToNext - b.eff.msToNext);
    return upcoming[0] ? upcoming[0].t : targets[0];
  }

  return items.find(i => i.category === category && i.name === name) || null;
}

// Sorts event list cards so "Running now" (including "ending soon") surfaces
// first, then soonest-starting upcoming events, then anything with no usable
// timing data — in that priority order. Ties (e.g. several events with no
// timing) keep their original list order since Array#sort is stable in all
// supported browsers.
function timingRank(effective) {
  if (!effective) return [2, 0];
  if (effective.running) return [0, 0];
  if (effective.msToNext != null) return [1, effective.msToNext];
  return [2, 0];
}
function sortByTiming(items, getEffective) {
  return [...items]
    .map((item, i) => ({ item, i, rank: timingRank(getEffective(item)) }))
    .sort((a, b) => (a.rank[0] - b.rank[0]) || (a.rank[1] - b.rank[1]) || (a.i - b.i))
    .map(x => x.item);
}

// Live-updating clock so countdowns tick down on screen instead of showing a
// fixed date. Each component using this gets its own 1-second interval.
function useTicker() {
  const [now, setNow] = React.useState(() => new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}

// Formats a millisecond duration the same way totalcalculator.org does
// ("56m", "4h26m", "1d 4h 56m"), counting down live.
function formatCountdown(ms) {
  if (ms == null) return null;
  if (ms <= 0) return "starting any moment";
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (days > 0) return `${days}d ${hours}h ${mins}m`;
  if (hours > 0) return `${hours}h ${mins}m`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}

// ─── ICONS ──────────────────────────────────────────────────────────────────
// Simple single-colour line icons (inherit currentColor from whatever text
// they sit next to) instead of multi-colour emoji glyphs — used for nav tabs,
// timing/status indicators, and empty-state messages throughout the app.
const Icon = ({ name, size = 18, style }) => {
  const common = {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
    style: { display: "block", flexShrink: 0, ...style },
  };
  switch (name) {
    case "feed": // News Feed tab — simple list/document
      return (
        <svg {...common}>
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <line x1="8" y1="9" x2="16" y2="9" />
          <line x1="8" y1="13" x2="16" y2="13" />
          <line x1="8" y1="17" x2="12" y2="17" />
        </svg>
      );
    case "clock": // Mini Events tab, "starts in" hints
      return (
        <svg {...common}>
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      );
    case "trophy": // Main Events tab, Rewards
      return (
        <svg {...common}>
          <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" />
          <path d="M7 5H4a3 3 0 0 0 3 3" />
          <path d="M17 5h3a3 3 0 0 1-3 3" />
          <line x1="12" y1="13" x2="12" y2="17" />
          <path d="M9 20h6l-1-3h-4l-1 3Z" />
        </svg>
      );
    case "inbox": // Approvals tab
      return (
        <svg {...common}>
          <path d="M3 13h5l2 3h4l2-3h5" />
          <path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5L5.5 5Z" />
        </svg>
      );
    case "gear": { // Admin tab
      const teeth = [0, 45, 90, 135, 180, 225, 270, 315];
      return (
        <svg {...common}>
          <circle cx="12" cy="12" r="4" />
          {teeth.map(deg => (
            <line key={deg} x1="12" y1="3" x2="12" y2="5.4" transform={`rotate(${deg} 12 12)`} />
          ))}
        </svg>
      );
    }
    case "dot": // "running now" indicator — filled, sits inline with status text
      return <svg {...common}><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none" /></svg>;
    case "hourglass": // loading screen
      return (
        <svg {...common}>
          <line x1="6" y1="3" x2="18" y2="3" /><line x1="6" y1="21" x2="18" y2="21" />
          <path d="M6 3v3.5a6 6 0 0 0 12 0V3" />
          <path d="M6 21v-3.5a6 6 0 0 1 12 0V21" />
        </svg>
      );
    case "shield": // login screen logo
      return (
        <svg {...common}>
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z" />
          <path d="M9 12l2 2 4-4" />
        </svg>
      );
    default:
      return null;
  }
};

const TimingBanner = ({ category, name }) => {
  const now = useTicker();
  const item = getScheduleItem(category, name, now);
  const schedule = Store.get("schedule") || {};

  if (!item) {
    return (
      <div style={{
        background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10,
        padding: "10px 14px", fontSize: 13, color: "#1e40af", marginBottom: 16,
        display: "flex", alignItems: "flex-start", gap: 8,
      }}>
        <Icon name="clock" size={16} style={{ marginTop: 1 }} />
        <span>Timing isn't connected yet — once the schedule sync is set up, this will show what's running now and what's coming up next.</span>
      </div>
    );
  }

  const eff = getEffectiveSchedule(item, now);
  const updatedLine = schedule.lastScraped && (
    <div style={{ fontSize: 11, opacity: 0.7, marginTop: 4 }}>Updated {formatDateTime(schedule.lastScraped)}</div>
  );

  if (eff.running) {
    return (
      <div style={{
        background: eff.endingSoon ? "#fffbeb" : "#f0fdf4",
        border: "1px solid " + (eff.endingSoon ? "#fde68a" : "#bbf7d0"),
        borderRadius: 10, padding: "10px 14px", fontSize: 13,
        color: eff.endingSoon ? "#92400e" : "#166534", marginBottom: 16,
      }}>
        <div style={{ fontWeight: 700, marginBottom: eff.endingSoon ? 4 : 0, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="dot" size={10} /> {eff.endingSoon ? "Ending soon" : "Running now"}
        </div>
        {eff.endingSoon && eff.msToNext != null && (
          <div>Ends in <strong>{formatCountdown(eff.msToNext)}</strong></div>
        )}
        {updatedLine}
      </div>
    );
  }

  if (eff.msToNext != null) {
    return (
      <div style={{
        background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10,
        padding: "10px 14px", fontSize: 13, color: "#1e40af", marginBottom: 16,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="clock" size={14} /> Starts in <strong>{formatCountdown(eff.msToNext)}</strong>
        </div>
        {updatedLine}
      </div>
    );
  }

  return (
    <div style={{
      background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10,
      padding: "10px 14px", fontSize: 13, color: "#1e40af", marginBottom: 16,
    }}>
      <div>{eff.justEnded ? "Just wrapped up — refreshing shortly." : "Timing not available for this event yet."}</div>
      {updatedLine}
    </div>
  );
};

// Compact one-line, live-ticking timing hint used on the Mini/Main event list cards.
const TimingHint = ({ sched }) => {
  const now = useTicker();
  if (!sched) return null;
  const eff = getEffectiveSchedule(sched, now);
  if (!eff) return null;

  if (eff.running) {
    return (
      <div style={{ fontSize: 12, marginTop: 2, color: eff.endingSoon ? "#b45309" : "#16a34a", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
        <Icon name={eff.endingSoon ? "clock" : "dot"} size={eff.endingSoon ? 12 : 9} />
        {eff.endingSoon ? `Ending soon — ${formatCountdown(eff.msToNext)}` : "Running now"}
      </div>
    );
  }
  if (eff.msToNext != null) {
    return (
      <div style={{ fontSize: 12, marginTop: 2, color: "#2563eb", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
        <Icon name="clock" size={12} />
        Starts in {formatCountdown(eff.msToNext)}
      </div>
    );
  }
  return null;
};

  display: "block", width: "100%", textAlign: "left", background: "#fff",

// Split out of Hints & Tips per Kirsty's request — 1st place reward and a
// single combined reward for everyone from 2nd through 100th place. Shown

  const r = rewards || {};
  const hasAny = !!(r.first || r.rest);
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Rewards</div>
      <div style={{
        background: "#fff", border: "1px dashed #cbd5e1", borderRadius: 10,
        padding: 14, fontSize: 13, color: hasAny ? "#0f172a" : "#94a3b8",

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {r.first && (
              <div><span style={{ fontWeight: 700 }}>1st: </span>{r.first}</div>

              <div><span style={{ fontWeight: 700 }}>2nd - 100th: </span>{r.rest}</div>
            )}

        ) : "No rewards added yet — these will be added and can be edited from Admin."}

};

const MiniEventDetail = ({ name, onBack, onChanged, backLabel }) => {
  const session = useSession();
  const canEnter = roleAtLeast(session.role, "superior"); // direct save, no approval
  const isViewer = session.role === "viewer";              // submit-for-approval instead

  const [, setTick] = useState(0);
  const ev = Store.getMiniEvent(name);
  const myPending = Store.getPending().filter(p => p.category === "mini" && p.eventName === name);

  const [highest, setHighest] = useState("");
  const [lowest, setLowest] = useState("");
  const [submitterName, setSubmitterName] = useState("");
  const [saved, setSaved] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  const addScore = () => {
    if (highest === "" || lowest === "" || isNaN(highest) || isNaN(lowest)) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      date: new Date().toISOString(),
      highest: Number(highest),
      lowest: Number(lowest),
    };
    const history = [entry, ...ev.history].slice(0, 3);
    Store.setMiniEvent(name, { history });
    setHighest(""); setLowest("");
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
    setTick(t => t + 1);
    onChanged && onChanged();
  };

  const submitForApproval = () => {
    if (!submitterName.trim() || highest === "" || lowest === "" || isNaN(highest) || isNaN(lowest)) return;
    Store.addPending({
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      category: "mini",
      eventName: name,
      highest: Number(highest),
      lowest: Number(lowest),
      submittedBy: submitterName.trim(),
      submittedAt: new Date().toISOString(),
    });
    setHighest(""); setLowest(""); setSubmitterName("");
    setSubmitted(true);
    setTimeout(() => setSubmitted(false), 2000);
    setTick(t => t + 1);
    onChanged && onChanged();
  };

  return (
    <div style={{ padding: "16px 20px 100px" }}>
      <button onClick={onBack} style={{
        background: "none", border: "none", color: "#2563eb", fontSize: 14,
        padding: "6px 0 14px", fontWeight: 600,
      }}>&larr; {backLabel || "All mini events"}</button>

      <h2 style={{ fontSize: 20, color: "#0f172a", margin: "0 0 12px" }}>{name}</h2>

      <TimingBanner category="mini" name={name} />

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Hints &amp; tips</div>
        <div style={{
          background: "#fff", border: "1px dashed #cbd5e1", borderRadius: 10,
          padding: 14, fontSize: 13, color: ev.tip ? "#0f172a" : "#94a3b8",
        }}>
          {ev.tip || "No tips added yet — these will be added and can be edited from Admin."}
        </div>
      </div>

      <RewardsBlock rewards={ev.rewards} />

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Last 3 scores</div>
        {ev.history.length === 0 ? (
          <div style={{ fontSize: 13, color: "#94a3b8", padding: "10px 0" }}>No scores recorded yet.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {ev.history.map(h => (
              <div key={h.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>{formatDateTime(h.date)}</span>
                <span style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ color: "#16a34a", fontWeight: 600 }}>H {formatScore(h.highest)}</span>
                  {"  "}
                  <span style={{ color: "#dc2626", fontWeight: 600 }}>L {formatScore(h.lowest)}</span>
                  {canEnter && (
                    <button
                      onClick={() => {
                        if (window.confirm("Delete this score entry? This can't be undone.")) {
                          Store.deleteMiniEventEntry(name, h.id);
                          setTick(t => t + 1);
                          onChanged && onChanged();
                        }
                      }}
                      style={{
                        background: "none", border: "none", color: "#94a3b8", fontSize: 18,
                        fontWeight: 700, padding: 2, lineHeight: 1,
                      }}
                      aria-label="Delete score"
                      title="Delete score"
                    >✕</button>
                  )}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      {canEnter && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Record a score</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="numeric" placeholder="Highest score" value={highest}
              onChange={e => setHighest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
            <input
              type="number" inputMode="numeric" placeholder="Lowest score" value={lowest}
              onChange={e => setLowest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
          </div>
          <button
            onClick={addScore}
            style={{
              width: "100%", padding: "11px", borderRadius: 8, border: "none",
              background: "#0f172a", color: "#fff", fontSize: 14, fontWeight: 600,
            }}
          >Save score</button>
          {saved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 8, textAlign: "center" }}>Saved ✓</div>}

          {myPending.length > 0 && (
            <div style={{ marginTop: 16, fontSize: 12, color: "#b45309", background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px" }}>
              {myPending.length} submission{myPending.length > 1 ? "s" : ""} awaiting approval for this event — see the Approvals tab.
            </div>
          )}
        </div>
      )}

      {isViewer && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Submit a score</div>
          <p style={{ fontSize: 12, color: "#94a3b8", margin: "0 0 10px" }}>
            Goes to a superior for approval before it's added to the record.
          </p>
          <input
            type="text" placeholder="Your name" value={submitterName}
            onChange={e => setSubmitterName(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14, marginBottom: 8, boxSizing: "border-box" }}
          />
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="numeric" placeholder="Highest score" value={highest}
              onChange={e => setHighest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
            <input
              type="number" inputMode="numeric" placeholder="Lowest score" value={lowest}
              onChange={e => setLowest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
          </div>
          <button
            onClick={submitForApproval}
            style={{
              width: "100%", padding: "11px", borderRadius: 8, border: "none",
              background: "#2563eb", color: "#fff", fontSize: 14, fontWeight: 600,
            }}
          >Submit for approval</button>
          {submitted && <div style={{ color: "#2563eb", fontSize: 12, marginTop: 8, textAlign: "center" }}>Submitted — thanks! ✓</div>}

          {myPending.length > 0 && (
            <div style={{ marginTop: 16, fontSize: 12, color: "#64748b" }}>
              Your pending submissions for this event: {myPending.map(p => `H ${formatScore(p.highest)} / L ${formatScore(p.lowest)}`).join(", ")}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const EpicMonsterCard = ({ m }) => {
  const types = [m.type1, m.type2, m.type3].filter(Boolean).join(" / ");
  const stat = (label, value) => (!value ? null : (
    <div style={{ fontSize: 12 }}>
      <span style={{ color: "#94a3b8" }}>{label}: </span>
      <span style={{ color: "#0f172a", fontWeight: 600 }}>{formatMaybeNum(value)}</span>
    </div>
  ));
  return (
    <div style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 8, padding: 10, marginBottom: 6 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a", marginBottom: 4 }}>
        {m.order ? `#${m.order} · ` : ""}{m.name}
      </div>
      {types && <div style={{ fontSize: 12, color: "#475569", marginBottom: 4 }}>{types}</div>}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 14px" }}>
        {stat("Strong vs", m.strengthAgainst && (m.pctStrengthAgainst ? `${m.strengthAgainst} (${m.pctStrengthAgainst})` : m.strengthAgainst))}
        {stat("Initiative", m.initiative)}
        {stat("Strength", m.strength)}
        {stat("Health", m.health)}
        {stat("Leadership", m.leadership)}
        {stat("Quantity", m.quantity)}
        {stat("Total Health", m.totalHealth)}

};

const MainEventDetail = ({ name, onBack, onChanged, backLabel }) => {
  const meta = MAIN_EVENT_LOOKUP[name] || { category: "monthly", hasDivisions: true };
  const session = useSession();
  const canEnter = roleAtLeast(session.role, "superior");
  const isViewer = session.role === "viewer";

  const [, setTick] = useState(0);
  const ev = Store.getMainEvent(name);
  const divisions = Store.getDivisions();
  const myPending = Store.getPending().filter(p => p.category === "main" && p.eventName === name);

  const [division, setDivision] = useState("");
  const [highest, setHighest] = useState("");
  const [lowest, setLowest] = useState("");
  const [submitterName, setSubmitterName] = useState("");
  const [saved, setSaved] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  const valid = () => {
    if (highest === "" || lowest === "" || isNaN(highest) || isNaN(lowest)) return false;
    if (meta.hasDivisions && !division.trim()) return false;
    return true;
  };

  const addScore = () => {
    if (!valid()) return;
    if (meta.hasDivisions) Store.ensureDivision(division);
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      date: new Date().toISOString(),
      highest: Number(highest),
      lowest: Number(lowest),
      division: meta.hasDivisions ? division.trim() : null,
    };
    const history = [entry, ...ev.history].slice(0, 3);
    Store.setMainEvent(name, { history });
    setHighest(""); setLowest(""); setDivision("");
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
    setTick(t => t + 1);
    onChanged && onChanged();
  };

  const submitForApproval = () => {
    if (!submitterName.trim() || !valid()) return;
    Store.addPending({
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      category: "main",
      eventName: name,
      highest: Number(highest),
      lowest: Number(lowest),
      division: meta.hasDivisions ? division.trim() : null,
      submittedBy: submitterName.trim(),
      submittedAt: new Date().toISOString(),
    });
    setHighest(""); setLowest(""); setDivision(""); setSubmitterName("");
    setSubmitted(true);
    setTimeout(() => setSubmitted(false), 2000);
    setTick(t => t + 1);
    onChanged && onChanged();
  };

  return (
    <div style={{ padding: "16px 20px 100px" }}>
      <button onClick={onBack} style={{
        background: "none", border: "none", color: "#2563eb", fontSize: 14,
        padding: "6px 0 14px", fontWeight: 600,
      }}>&larr; {backLabel || "All main events"}</button>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <h2 style={{ fontSize: 20, color: "#0f172a", margin: 0 }}>{name}</h2>
        <span style={{ fontSize: 11, fontWeight: 600, color: "#475569", background: "#e2e8f0", padding: "2px 8px", borderRadius: 999 }}>
          {MAIN_CATEGORY_LABEL[meta.category]}
        </span>
      </div>
      {!meta.hasDivisions && (
        <p style={{ fontSize: 12, color: "#94a3b8", margin: "0 0 12px" }}>No divisions for this event.</p>
      )}
      {meta.hasDivisions && <div style={{ marginBottom: 12 }} />}

      <TimingBanner category={meta.category} name={name} />

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Hints &amp; tips</div>
        <div style={{
          background: "#fff", border: "1px dashed #cbd5e1", borderRadius: 10,
          padding: 14, fontSize: 13, color: ev.tip ? "#0f172a" : "#94a3b8",
        }}>
          {ev.tip || "No tips added yet — these will be added and can be edited from Admin."}
        </div>
      </div>

      <RewardsBlock rewards={ev.rewards} />

      <EpicsSection eventName={name} />

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Last 3 scores</div>
        {ev.history.length === 0 ? (
          <div style={{ fontSize: 13, color: "#94a3b8", padding: "10px 0" }}>No scores recorded yet.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {ev.history.map(h => (
              <div key={h.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>
                  {formatDateTime(h.date)}
                  {h.division ? ` · Division ${h.division}` : ""}
                </span>
                <span style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ color: "#16a34a", fontWeight: 600 }}>H {formatScore(h.highest)}</span>
                  {"  "}
                  <span style={{ color: "#dc2626", fontWeight: 600 }}>L {formatScore(h.lowest)}</span>
                  {canEnter && (
                    <button
                      onClick={() => {
                        if (window.confirm("Delete this score entry? This can't be undone.")) {
                          Store.deleteMainEventEntry(name, h.id);
                          setTick(t => t + 1);
                          onChanged && onChanged();
                        }
                      }}
                      style={{
                        background: "none", border: "none", color: "#94a3b8", fontSize: 18,
                        fontWeight: 700, padding: 2, lineHeight: 1,
                      }}
                      aria-label="Delete score"
                      title="Delete score"
                    >✕</button>
                  )}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      {canEnter && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Record a score</div>
          {meta.hasDivisions && (
            <DivisionSelect value={division} onChange={setDivision} divisions={divisions} />
          )}
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="numeric" placeholder="Highest score" value={highest}
              onChange={e => setHighest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
            <input
              type="number" inputMode="numeric" placeholder="Lowest score" value={lowest}
              onChange={e => setLowest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
          </div>
          <button
            onClick={addScore}
            style={{
              width: "100%", padding: "11px", borderRadius: 8, border: "none",
              background: "#0f172a", color: "#fff", fontSize: 14, fontWeight: 600,
            }}
          >Save score</button>
          {saved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 8, textAlign: "center" }}>Saved ✓</div>}

          {myPending.length > 0 && (
            <div style={{ marginTop: 16, fontSize: 12, color: "#b45309", background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px" }}>
              {myPending.length} submission{myPending.length > 1 ? "s" : ""} awaiting approval for this event — see the Approvals tab.
            </div>
          )}
        </div>
      )}

      {isViewer && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 6 }}>Submit a score</div>
          <p style={{ fontSize: 12, color: "#94a3b8", margin: "0 0 10px" }}>
            Goes to a superior for approval before it's added to the record.
          </p>
          <input
            type="text" placeholder="Your name" value={submitterName}
            onChange={e => setSubmitterName(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14, marginBottom: 8, boxSizing: "border-box" }}
          />
          {meta.hasDivisions && (
            <DivisionSelect value={division} onChange={setDivision} divisions={divisions} />
          )}
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="numeric" placeholder="Highest score" value={highest}
              onChange={e => setHighest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
            <input
              type="number" inputMode="numeric" placeholder="Lowest score" value={lowest}
              onChange={e => setLowest(e.target.value)}
              style={{ flex: 1, minWidth: 0, padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 }}
            />
          </div>
          <button
            onClick={submitForApproval}
            style={{
              width: "100%", padding: "11px", borderRadius: 8, border: "none",
              background: "#2563eb", color: "#fff", fontSize: 14, fontWeight: 600,
            }}
          >Submit for approval</button>
          {submitted && <div style={{ color: "#2563eb", fontSize: 12, marginTop: 8, textAlign: "center" }}>Submitted — thanks! ✓</div>}

          {myPending.length > 0 && (
            <div style={{ marginTop: 16, fontSize: 12, color: "#64748b" }}>
              Your pending submissions for this event: {myPending.map(p => `${p.division ? "Div " + p.division + ": " : ""}H ${formatScore(p.highest)} / L ${formatScore(p.lowest)}`).join(", ")}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const NewsFeedScreen = () => {
  const now = useTicker();
  const [selected, setSelected] = useState(null); // { category, name } or null
  const [, setTick] = useState(0);
  const schedule = Store.get("schedule") || { items: [] };
  const hasScheduleData = (schedule.items || []).length > 0;

  // Tapping a feed card opens the exact same detail page Mini/Main Events use
  // (score entry, hints, rewards, epics — everything). Back returns to the
  // News Feed list rather than jumping to that event's own tab, so the bottom
  // nav keeps "News Feed" highlighted the whole time (confirmed with Kirsty).
  if (selected) {
    const onBack = () => { setSelected(null); setTick(t => t + 1); };
    const onChanged = () => setTick(t => t + 1);
    return selected.category === "mini"
      ? <MiniEventDetail name={selected.name} onBack={onBack} onChanged={onChanged} backLabel="News Feed" />
      : <MainEventDetail name={selected.name} onBack={onBack} onChanged={onChanged} backLabel="News Feed" />;
  }

  const feedItems = [
    ...MINI_EVENTS.map(name => ({ badge: "Mini", category: "mini", name, ev: Store.getMiniEvent(name) })),
    ...MAIN_EVENTS.map(e => ({ badge: MAIN_CATEGORY_LABEL[e.category], category: e.category, name: e.name, ev: Store.getMainEvent(e.name) })),
  ]
    .map(item => ({ ...item, eff: getEffectiveSchedule(getScheduleItem(item.category, item.name, now), now) }))
    .filter(item => item.eff && (item.eff.running || (item.eff.msToNext != null && item.eff.msToNext <= FEED_WINDOW_MS)));

  const sorted = sortByTiming(feedItems, item => item.eff);

  return (
    <div style={{ padding: "20px 20px 100px" }}>
      <h2 style={{ fontSize: 20, color: "#0f172a", margin: "0 0 4px" }}>News Feed</h2>
      <p style={{ fontSize: 14, color: "#64748b", margin: "0 0 16px" }}>
        Everything running now, or starting in the next 24 hours, with the rewards on offer.
      </p>

      {!hasScheduleData ? (
        <div style={{
          border: "2px dashed #cbd5e1", borderRadius: 12, padding: 24,
          color: "#94a3b8", fontSize: 13, textAlign: "center",
        }}>
          Timing isn't connected yet — once the schedule sync is set up, this feed will show what's running now and what's starting soon.
        </div>
      ) : sorted.length === 0 ? (
        <div style={{
          border: "2px dashed #cbd5e1", borderRadius: 12, padding: 24,
          color: "#94a3b8", fontSize: 13, textAlign: "center",
        }}>
          Nothing running or starting in the next 24 hours right now — check back later.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {sorted.map(item => {
            const eff = item.eff;
            const statusColor = eff.running ? (eff.endingSoon ? "#b45309" : "#16a34a") : "#2563eb";
            const statusText = eff.running
              ? (eff.endingSoon ? `Ending soon — ${formatCountdown(eff.msToNext)}` : "Running now")
              : `Starts in ${formatCountdown(eff.msToNext)}`;
            return (
              <button
                key={`${item.category}-${item.name}`}
                onClick={() => setSelected({ category: item.category, name: item.name })}
                style={cardStyle}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ fontWeight: 600, fontSize: 14, color: "#0f172a" }}>{item.name}</div>
                  <span style={{ fontSize: 11, fontWeight: 600, color: "#475569", background: "#e2e8f0", padding: "2px 8px", borderRadius: 999, whiteSpace: "nowrap" }}>
                    {item.badge}
                  </span>
                </div>
                <div style={{ fontSize: 12, marginTop: 2, color: statusColor, fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
                  <Icon name={eff.running && !eff.endingSoon ? "dot" : "clock"} size={eff.running && !eff.endingSoon ? 9 : 12} />
                  {statusText}
                </div>
                <FeedRewardsLine rewards={item.ev.rewards} />
              </button>
            );
          })}
        </div>
      )}

      {schedule.lastScraped && (
        <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 16, textAlign: "center" }}>Updated {formatDateTime(schedule.lastScraped)}</div>
      )}
    </div>
  );
};

const sectionLabelStyle = { fontSize: 12, fontWeight: 700, color: "#64748b", textTransform: "uppercase", marginBottom: 8 };
const adminInputStyle = { flex: 1, minWidth: 0, padding: "9px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14 };
const adminButtonStyle = { padding: "9px 16px", borderRadius: 8, border: "none", background: "#0f172a", color: "#fff", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" };

const PIN_ROLE_LABEL = { viewer: "Viewer", superior: "Superior", admin: "Admin" };

const AdminPinRow = ({ role }) => {
  const [value, setValue] = useState(Store.getPins()[role]);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState(false);

  const save = () => {
    const clean = (value || "").trim();
    if (!/^\d{4}$/.test(clean)) { setError(true); setTimeout(() => setError(false), 1500); return; }
    Store.setPin(role, clean);
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "#0f172a", marginBottom: 4 }}>{PIN_ROLE_LABEL[role]} PIN</div>
      <div style={{ display: "flex", gap: 8 }}>
        <input
          value={value} onChange={e => setValue(e.target.value.replace(/\D/g, "").slice(0, 4))}
          inputMode="numeric" maxLength={4} style={{ ...adminInputStyle, letterSpacing: 2 }}
        />
        <button onClick={save} style={adminButtonStyle}>Save</button>
      </div>
      {saved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 4 }}>Saved ✓</div>}
      {error && <div style={{ color: "#dc2626", fontSize: 12, marginTop: 4 }}>PIN must be exactly 4 digits</div>}
    </div>
  );
};

const AdminDivisions = () => {
  const [, setTick] = useState(0);
  const [newDiv, setNewDiv] = useState("");
  const divisions = Store.getDivisions();

  const add = () => {
    const clean = newDiv.trim();
    if (!clean) return;
    Store.ensureDivision(clean);
    setNewDiv("");
    setTick(t => t + 1);
  };
  const remove = (name) => {
    Store.removeDivision(name);
    setTick(t => t + 1);
  };

  return (
    <div>
      {divisions.length === 0 ? (
        <p style={{ fontSize: 13, color: "#94a3b8", margin: "0 0 12px" }}>
          No divisions yet — add one below. Monthly/Weekly score entry won't work until at least one exists.
        </p>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          {divisions.map(d => (
            <span key={d} style={{
              display: "flex", alignItems: "center", gap: 6, background: "#f1f5f9",
              border: "1px solid #e2e8f0", borderRadius: 999, padding: "5px 6px 5px 12px", fontSize: 13,
            }}>
              {d}
              <button
                onClick={() => remove(d)}

            </span>
          ))}

      )}
      <div style={{ display: "flex", gap: 8 }}>
        <input
          value={newDiv} onChange={e => setNewDiv(e.target.value)} placeholder="New division (e.g. X - 9)"

const TIP_CATEGORY_OPTIONS = [
  { key: "mini", label: "Mini Events" },
  { key: "monthly", label: "Monthly" },
  { key: "weekly", label: "Weekly" },
  { key: "biweekly", label: "Biweekly" },
];

function eventsForTipCategory(key) {
  if (key === "mini") return MINI_EVENTS.map(n => ({ name: n, kind: "mini" }));
  return MAIN_EVENTS.filter(e => e.category === key).map(e => ({ name: e.name, kind: "main" }));
}

const AdminTips = () => {
  const [category, setCategory] = useState("mini");
  const options = eventsForTipCategory(category);
  const [eventName, setEventName] = useState(options[0]?.name || "");
  const kind = category === "mini" ? "mini" : "main";
  const [tipDraft, setTipDraft] = useState("");
  const [tipSaved, setTipSaved] = useState(false);
  const [rewardFirst, setRewardFirst] = useState("");
  const [rewardRest, setRewardRest] = useState("");
  const [rewardsSaved, setRewardsSaved] = useState(false);

  useEffect(() => {
    const opts = eventsForTipCategory(category);
    setEventName(opts[0]?.name || "");
  }, [category]);

  useEffect(() => {
    if (!eventName) { setTipDraft(""); setRewardFirst(""); setRewardRest(""); return; }
    const current = kind === "mini" ? Store.getMiniEvent(eventName) : Store.getMainEvent(eventName);
    setTipDraft(current.tip || "");
    setRewardFirst(current.rewards?.first || "");
    setRewardRest(current.rewards?.rest || "");
  }, [eventName, kind]);

  const saveTip = () => {
    if (!eventName) return;
    if (kind === "mini") Store.setMiniEvent(eventName, { tip: tipDraft });
    else Store.setMainEvent(eventName, { tip: tipDraft });
    setTipSaved(true);
    setTimeout(() => setTipSaved(false), 1500);
  };

  const saveRewards = () => {
    if (!eventName) return;
    const rewards = { first: rewardFirst, rest: rewardRest };
    if (kind === "mini") Store.setMiniEvent(eventName, { rewards });
    else Store.setMainEvent(eventName, { rewards });
    setRewardsSaved(true);
    setTimeout(() => setRewardsSaved(false), 1500);
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <select
          value={category} onChange={e => setCategory(e.target.value)}
          style={{ ...adminInputStyle, flex: "0 0 130px" }}
        >
          {TIP_CATEGORY_OPTIONS.map(o => <option key={o.key} value={o.key}>{o.label}</option>)}
        </select>
        <select
          value={eventName} onChange={e => setEventName(e.target.value)}
          style={adminInputStyle}
        >
          {options.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
        </select>
      </div>

      <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", marginBottom: 6 }}>Hints &amp; tips</div>
      <textarea
        value={tipDraft} onChange={e => setTipDraft(e.target.value)}
        placeholder="Hints and tips for this event..."
        rows={4}
        style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 14, boxSizing: "border-box", resize: "vertical", marginBottom: 8 }}
      />
      <button onClick={saveTip} style={{ ...adminButtonStyle, width: "100%" }}>Save tip</button>
      {tipSaved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 8, textAlign: "center" }}>Saved ✓</div>}

      <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", margin: "20px 0 6px" }}>Rewards</div>
      <input
        value={rewardFirst} onChange={e => setRewardFirst(e.target.value)}
        placeholder="1st place reward"
        style={{ ...adminInputStyle, width: "100%", marginBottom: 8, boxSizing: "border-box" }}
      />
      <input
        value={rewardRest} onChange={e => setRewardRest(e.target.value)}
        placeholder="2nd - 100th place reward"
        style={{ ...adminInputStyle, width: "100%", marginBottom: 8, boxSizing: "border-box" }}
      />
      <button onClick={saveRewards} style={{ ...adminButtonStyle, width: "100%" }}>Save rewards</button>
      {rewardsSaved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 8, textAlign: "center" }}>Saved ✓</div>}
    </div>
  );
};

const EPIC_PASTE_PLACEHOLDER =
  "Optional: paste rows copied from a spreadsheet (tab-separated) to fill the grid below instead of typing:\n" +
  "Arcanomancer\t4\t1\tArcanomancer\tMelee\t\tEpic\tMounted\t45%\t10\t70000\t210000\t74\t\t0\t0\tC\t3";

// Column order matches Kirsty's spreadsheet layout, minus "Epic" and "# of
// Monsters" (those are the Epic Name field above the grid, and the row count).
const MONSTER_FIELD_DEFS = [
  { key: "order", label: "Order", width: 56 },
  { key: "name", label: "Name", width: 170 },
  { key: "type1", label: "Type 1", width: 100 },
  { key: "type2", label: "Type 2", width: 100 },
  { key: "type3", label: "Type 3", width: 100 },
  { key: "strengthAgainst", label: "Strength Against", width: 140 },
  { key: "pctStrengthAgainst", label: "% Strength Against", width: 110 },
  { key: "initiative", label: "Initiative", width: 90 },
  { key: "strength", label: "Strength", width: 100 },
  { key: "health", label: "Health", width: 100 },
  { key: "leadership", label: "Leadership", width: 100 },
  { key: "quantity", label: "Quantity", width: 90 },
  { key: "totalHealth", label: "Total Health", width: 110 },
  { key: "totalStrength", label: "Total Strength", width: 110 },
];

function emptyMonsterRow() {
  const m = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}` };
  MONSTER_FIELD_DEFS.forEach(f => { m[f.key] = ""; });
  return m;
}

const MonsterFieldGrid = ({ monster, onChange }) => (
  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
    {MONSTER_FIELD_DEFS.map(f => (
      <div key={f.key} style={{ flex: `0 0 ${f.width}px`, minWidth: f.width }}>
        <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 2, textTransform: "uppercase", fontWeight: 600 }}>{f.label}</div>
        <input
          value={monster[f.key] || ""}
          onChange={e => onChange(f.key, e.target.value)}
          style={{ width: "100%", padding: "6px 8px", borderRadius: 6, border: "1px solid #cbd5e1", fontSize: 13, boxSizing: "border-box" }}
        />
      </div>
    ))}
  </div>
);

const AdminEpics = () => {
  const [, setTick] = useState(0);
  const [editingId, setEditingId] = useState(null);
  const [epicName, setEpicName] = useState("");
  const [event, setEvent] = useState(MAIN_EVENTS[0].name);
  const [day, setDay] = useState("");
  const [captainHero, setCaptainHero] = useState("");
  const [numCaptains, setNumCaptains] = useState("");
  const [meat, setMeat] = useState("");
  const [chests, setChests] = useState("");
  const [monsters, setMonsters] = useState([emptyMonsterRow()]);
  const [showPaste, setShowPaste] = useState(false);
  const [paste, setPaste] = useState("");
  const [error, setError] = useState("");
  const [saved, setSaved] = useState(false);
  const epics = Store.getEpics();

  const updateMonster = (id, key, value) => {
    setMonsters(ms => ms.map(m => m.id === id ? { ...m, [key]: value } : m));
  };
  const addMonster = () => setMonsters(ms => [...ms, emptyMonsterRow()]);
  const removeMonster = (id) => setMonsters(ms => ms.length > 1 ? ms.filter(m => m.id !== id) : ms);

  const resetForm = () => {
    setEditingId(null);
    setEpicName(""); setEvent(MAIN_EVENTS[0].name); setDay("");
    setCaptainHero(""); setNumCaptains(""); setMeat(""); setChests(""); setMonsters([emptyMonsterRow()]);
    setShowPaste(false); setPaste(""); setError("");
  };

  const startEdit = (ep) => {
    setError("");
    setEditingId(ep.id);
    setEpicName(ep.name || "");
    setEvent(ep.event || MAIN_EVENTS[0].name);
    setDay(ep.day || "");
    setCaptainHero(ep.captainHero || "");
    setNumCaptains(ep.numCaptains || "");
    setMeat(ep.meat || "");
    setChests(ep.chests || "");
    setMonsters(ep.monsters && ep.monsters.length ? ep.monsters.map(m => ({ ...m })) : [emptyMonsterRow()]);
    setShowPaste(false);
    setPaste("");
  };

  const fillFromPaste = () => {
    setError("");
    const result = parseEpicPaste(paste);
    if (result.error) { setError(result.error); return; }
    setEpicName(result.epicName);
    setCaptainHero(normalizeCaptainHero(result.captainHero));
    setNumCaptains(result.numCaptains || "");
    setMonsters(result.monsters);
    setPaste("");
    setShowPaste(false);
  };

  const saveEpic = () => {
    setError("");
    const cleanName = epicName.trim();
    if (!cleanName) { setError("Give this epic a name first."); return; }
    const validMonsters = monsters.filter(m => (m.name || "").trim());
    if (validMonsters.length === 0) { setError("Add at least one monster with a name."); return; }
    const payload = {
      event, day: day.trim(),
      name: cleanName,
      captainHero: captainHero.trim(),
      numCaptains: numCaptains.trim(),
      meat: meat.trim(),
      chests: chests.trim(),
      monsters: validMonsters,
    };
    if (editingId) {
      Store.updateEpic(editingId, payload);
    } else {
      Store.addEpic({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, ...payload });
    }
    resetForm();
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
    setTick(t => t + 1);
  };

  const remove = (id) => {
    if (window.confirm("Delete this epic and all its monster data? This can't be undone.")) {
      Store.deleteEpic(id);
      if (editingId === id) resetForm();
      setTick(t => t + 1);
    }
  };

  return (
    <div>
      {editingId && (
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 8,
          padding: "8px 12px", marginBottom: 10, fontSize: 12, color: "#1d4ed8", fontWeight: 600,
        }}>
          <span>Editing "{epicName || "epic"}"</span>
          <button
            onClick={resetForm}
            style={{ background: "none", border: "none", color: "#1d4ed8", fontSize: 12, fontWeight: 700, padding: "2px 4px" }}
          >Cancel</button>
        </div>
      )}
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <input
          value={epicName} onChange={e => setEpicName(e.target.value)}
          placeholder="Epic name (e.g. Arcanomancer)"
          style={{ ...adminInputStyle, flex: 2 }}
        />
        <input
          value={day} onChange={e => setDay(e.target.value)}
          placeholder="Day (optional)"
          style={{ ...adminInputStyle, flex: 1 }}
        />
      </div>
      <select value={event} onChange={e => setEvent(e.target.value)} style={{ ...adminInputStyle, width: "100%", marginBottom: 8 }}>
        {MAIN_EVENTS.map(e => <option key={e.name} value={e.name}>{e.name}</option>)}
      </select>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <select
          value={captainHero} onChange={e => setCaptainHero(e.target.value)}
          style={{ ...adminInputStyle, flex: 2, color: captainHero ? "#0f172a" : "#94a3b8" }}
        >
          <option value="">Captain / Hero (whole epic)</option>
          {CAPTAIN_HERO_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <input
          value={numCaptains} onChange={e => setNumCaptains(e.target.value)}
          placeholder="# Captains"
          style={{ ...adminInputStyle, flex: 1 }}
        />
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <input
          value={meat} onChange={e => setMeat(e.target.value)}
          placeholder="Meat (whole epic)"
          style={{ ...adminInputStyle, flex: 1 }}
        />
        <input
          value={chests} onChange={e => setChests(e.target.value)}
          placeholder="Clan chests"
          style={{ ...adminInputStyle, flex: 1 }}
        />
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 8 }}>
        {monsters.map((m, idx) => (
          <div key={m.id} style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 8, padding: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b" }}>Monster {idx + 1}</div>
              {monsters.length > 1 && (
                <button
                  onClick={() => removeMonster(m.id)}
                  style={{ background: "none", border: "none", color: "#dc2626", fontSize: 12, fontWeight: 600 }}
                >Remove</button>
              )}
            </div>
            <MonsterFieldGrid monster={m} onChange={(key, val) => updateMonster(m.id, key, val)} />
          </div>
        ))}
      </div>

      <button
        onClick={addMonster}
        style={{ ...adminButtonStyle, width: "100%", background: "#fff", color: "#0f172a", border: "1px solid #cbd5e1", marginBottom: 10 }}
      >+ Add monster</button>

      <button
        onClick={() => setShowPaste(s => !s)}
        style={{ background: "none", border: "none", color: "#2563eb", fontSize: 12, fontWeight: 600, padding: "2px 0", marginBottom: 8 }}
      >{showPaste ? "Hide paste-to-fill" : "Paste from a spreadsheet instead ▾"}</button>
      {showPaste && (
        <div style={{ marginBottom: 10 }}>
          <textarea
            value={paste} onChange={e => setPaste(e.target.value)}
            placeholder={EPIC_PASTE_PLACEHOLDER}
            rows={3}
            style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #cbd5e1", fontSize: 12, fontFamily: "monospace", boxSizing: "border-box", resize: "vertical", marginBottom: 6 }}
          />
          <button onClick={fillFromPaste} style={{ ...adminButtonStyle, width: "100%" }}>Fill grid from paste</button>
        </div>
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={saveEpic} style={{ ...adminButtonStyle, flex: 1 }}>
          {editingId ? "Save changes" : "Save epic"}
        </button>
        {editingId && (
          <button
            onClick={resetForm}
            style={{ ...adminButtonStyle, flex: 1, background: "#fff", color: "#0f172a", border: "1px solid #cbd5e1" }}
          >Cancel</button>
        )}
      </div>
      {saved && <div style={{ color: "#16a34a", fontSize: 12, marginTop: 8, textAlign: "center" }}>Saved ✓</div>}
      {error && <div style={{ color: "#dc2626", fontSize: 12, marginTop: 8 }}>{error}</div>}

      {epics.length > 0 && (
        <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
          {epics.map(ep => (
            <div key={ep.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#0f172a" }}>{ep.name}</div>
                <div style={{ fontSize: 12, color: "#64748b" }}>
                  {ep.event}{ep.day ? ` · ${formatDayLabel(ep.day)}` : ""} · {ep.monsters.length} monster{ep.monsters.length === 1 ? "" : "s"}
                  {ep.numCaptains && ep.captainHero ? ` · ${formatMaybeNum(ep.numCaptains)} ${ep.captainHero}` : ""}
                </div>
                {(ep.meat || ep.chests) && (
                  <div style={{ fontSize: 12, color: "#64748b" }}>
                    {ep.meat ? `${formatCompact(ep.meat)} Meat` : ""}
                    {ep.meat && ep.chests ? ", " : ""}
                    {ep.chests ? `${formatMaybeNum(ep.chests)} chests` : ""}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <button
                  onClick={() => startEdit(ep)}
                  style={{ background: "none", border: "none", color: "#2563eb", fontSize: 12, fontWeight: 600, padding: "4px 8px" }}
                >Edit</button>
                <button
                  onClick={() => remove(ep.id)}
                  style={{ background: "none", border: "none", color: "#dc2626", fontSize: 12, fontWeight: 600, padding: "4px 8px" }}
                >Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};
